<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <circle cx="50" cy="50" r="42" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.4"/>
  <!-- Tamil Letter 'கு' Calligraphy Outline -->
  <text x="50" y="65" font-family="'Noto Serif Tamil', serif" font-weight="900" font-size="52" fill="url(#goldGrad)" text-anchor="middle">கு</text>
</svg>
